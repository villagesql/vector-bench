# Dev profile — the fastest possible exercise of the whole ops path.
#
# Intended for validating framework changes, not for measuring anything. Pair it
# with the tiny synthetic dataset produced by tests/make-tiny-dataset.sh so a
# full ops cycle (build, concurrency, filtered, churn) runs in about a minute
# per engine and needs no dataset download.
name: dev
description: Minimal ops-only cycle on a tiny synthetic dataset (~1 min/engine)

datasets:
  - tiny-16-euclidean

k: 10
runs: 1

ann:
  # ann-benchmarks validates --dataset against its own registry, which does not
  # contain the synthetic dataset, so the recall/QPS path is off here.
  enabled: false
  m_values: [16]
  ef_search: [10, 40]
  pgvector_ef_construction: 200
  pgvector_build_modes: [post]
  batch: false
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  workloads: [build, concurrency, filtered, churn]
  m_values: [16]
  ef_search: 40
  subset_rows: null
  load_threads: 1
  max_queries: 100
  # [1, 2] until 2026-10-14. Two clients cannot decide a concurrency
  # verdict (see main.yml), and [1] alone would leave the fast loop
  # exercising no client pool at all, so this is [1, 4].
  client_counts: [1, 4]
  concurrency_duration_s: 4
  selectivities: [0.10, 0.50]
  # Sixty seconds a point, not the 300 s default, and the reason is this
  # profile's whole contract: "a full ops cycle runs in about a minute". Two
  # columns x two selectivities is four filtered points per engine, so the
  # default budget would print a 2.3 h worst case for a run that takes about
  # seven minutes across seven engines -- 20x the real cost, for the profile
  # people run most often, and over the 1 h threshold below which
  # `print_load_estimate` prints nothing at all. At 60 s the worst case is
  # 0.48 h and `dev` stays silent, which is what it should be: an estimate
  # for a framework exercise is noise. (0.41 h over the six engines that
  # preceded Percona; `dev` names no engines, so it runs whatever the
  # registry holds.)
  #
  # Note this is NOT the `long_run` warning, which is keyed on ingest above
  # 12 h and is False for `dev` either way. The 1 h threshold decides whether
  # the estimate BLOCK is printed; `long_run` decides whether that block
  # carries the "each M value reloads the corpus" caveat.
  #
  # Sixty seconds still bounds it: 100 queries in 60 s is a 1.7 QPS floor,
  # and the only engines that have ever gone near that were on a million rows
  # at 1% selectivity, not on this corpus. A dev point that does truncate is
  # recorded with `insufficient_sample` rather than dropped, so the failure
  # mode is a flagged point and not a missing one.
  filtered_budget_s: 60
  churn_fractions: [0.10]
  # Off here, and this is the §4.3 item 7 pass rather than an omission: a
  # readers=0 churn step measures the write-only re-insert rate, which is the
  # quantity the report showed before PR 4 and is not the same quantity as a
  # rate measured against concurrent readers. Keeping one shipped profile on
  # it means that rate stays measurable instead of being a setting nobody
  # runs.
  #
  # It also keeps dev what dev is for. The reader baseline is a fixed 30 s per
  # churn fraction and dev churns one fraction, so it is exactly 30 s per
  # engine for all seven -- half of a cycle CLAUDE.md documents as ~1 min per
  # engine. `smoke` runs the pool on the default 4, so the path is exercised
  # by the profile that gates a long run.
  churn_readers: 0
