# Gate profile — the fast pre-flight the e2e script runs before a real benchmark.
#
# Purpose: exercise the EXACT code paths a real run uses (real orchestrator, real
# ann `_start_server`/`done()` per-config server restart, real ops build), on the
# smallest grid that still triggers them — so a lifecycle bug fails HERE in a few
# minutes instead of hours into a full sweep, or (worse) silently as missing
# points.
#
# The critical property is **m_values with TWO entries**: ann-benchmarks
# instantiates one algorithm per (M, ...) config and the harness STOPS and
# RESTARTS the server between them (subprocess.Popen([vb-entrypoint server]) ->
# SQL SHUTDOWN -> Popen again, on the SAME persisted datadir). With a single M
# the server starts once and the restart path is never taken — which is exactly
# how a persisted-datadir restart bug slipped past a single-M smoke and left
# villagesql with 3 ann points while every restart died "exited with code 1".
# Two M values force at least one restart, so this gate covers it.
#
# fashion-mnist is used because ann-benchmarks only accepts datasets in its own
# registry (a synthetic tiny set is rejected on the ann path); the grid is kept
# minimal instead. ops uses a small subset so its half stays fast.
name: gate
description: Fast pre-flight — real ann+ops code paths, minimal grid, forces the per-config server restart

datasets:
  - fashion-mnist-784-euclidean

k: 10
runs: 1

ann:
  enabled: true
  # MULTIPLE M values on purpose. Each is a separate ann config, and the harness
  # STOPS and RESTARTS the server between configs on the same persisted datadir.
  # A single M never restarts (the old smoke's blind spot); TWO restarts once,
  # which only SAMPLES an intermittent restart race — it can pass by luck. FIVE M
  # values give 4 restarts per pass (×2 passes = 8), enough to reliably trip a
  # race that fires only some of the time. ef_search stays a single point for
  # speed — the restart count, not the query grid, is what this gate is for.
  m_values: [6, 8, 16, 24, 32]
  ef_search: [40]
  pgvector_ef_construction: 200
  # Exercise both pgvector build modes (post = bulk, incremental = per-INSERT),
  # like smoke, so an incremental-path bug surfaces here too.
  pgvector_build_modes: [post, incremental]
  batch: false
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  workloads: [build]
  m_values: [16]
  ef_search: 100
  # Small subset so the ops half is quick; the point is the code path, not a number.
  subset_rows: 10000
  load_threads: 1
  max_queries: 100
  client_counts: [1]
  concurrency_duration_s: 4
  selectivities: [0.10]
  churn_fractions: [0.10]
