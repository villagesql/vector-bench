# Reproduces MariaDB's "Big vector search benchmark: 10 databases compared"
# as closely as this framework can, on the terms the article itself used.
#   https://mariadb.org/big-vector-search-benchmark-10-databases-comparison/
#
# This is the sibling of `mariadb-blog`, and the two answer different questions.
#
#   mariadb-blog        every engine under an identical CPU and memory budget.
#                       Differences belong to the implementations. Single
#                       threaded ingest, InnoDB only, ef_construction pinned.
#
#   mariadb-blog-repro  every engine configured the way its own documentation
#                       recommends, allowed to use the machine. Differences
#                       include how well each vendor's defaults are chosen.
#                       This is what the article measured.
#
# WHY THIS PROFILE EXISTS
#
# The normalized run disagreed with the published numbers in one direction that
# could not be explained by hardware:
#
#   published:  MariaDB index build under 15 minutes, pgvector 2.5-3 hours
#   measured:   MariaDB 3.57 hours,                   pgvector 26 minutes
#
# That is inverted, and MariaDB is off by roughly 14x. The leading suspect is
# our own constraint rather than their measurement: the normalized pass forces
# single-threaded ingest so every engine builds under identical CPU, and MHNSW
# builds incrementally on INSERT, so ingest concurrency *is* the build. Their
# 15 minutes implies about 1,100 rows/s; we measured 77 on one thread.
#
# Two further candidates, both of which the tuned pass exercises and the
# normalized pass deliberately does not:
#
#   * Storage engine. MariaDB supports MyISAM for vector tables, which skips
#     redo and doublewrite entirely. The article does not say which engine it
#     used, so this is a hypothesis, and the tuned pass measures both.
#   * ef_construction. Only pgvector exposes it. Pinned at 200 in the
#     normalized pass; swept here, which is what a vendor-tuned run would do.
#
# WHAT STILL WILL NOT MATCH, AND CANNOT BE MADE TO
#
#   Hardware. Their Xeon E5-2660 v4 has AVX2 and no AVX-512; ours has AVX-512,
#   and both MHNSW and VIDX ship AVX-512 distance kernels. This favours the
#   MySQL-family engines here relative to the article. Building with
#   `--march x86-64-v3` would match their instruction set at the cost of no
#   longer measuring the machine we actually have. Worth doing as a separate
#   axis; not folded into this profile.
#
#   Version. Resolved: MariaDB 12.3 is now a first-class engine
#   (config/engines/mariadb123.yml, tag mariadb-12.3.2), so a run can carry
#   11.8.8 and 12.3 side by side and quantify the gap the article leaves as
#   "slower". It is opt-in rather than default because it is another hour of
#   compiling:
#
#     ./run-benchmark.sh build --engine mariadb123
#     ./run-benchmark.sh run --profile mariadb-blog-repro \
#         --engines mariadb,mariadb123,alisql,pgvector
#
#   Index parameters. Not published. The M and ef_search grids below are
#   ann-benchmarks' conventional ranges, not a claim to match theirs.
#
#   Scope. Ten databases there, three here.
#
# COST. Roughly 12-16 h, most of it AliSQL. Much cheaper than the normalized
# run because ingest is no longer pinned to one thread and the ops phase only
# measures build cost -- concurrency, filtered search and churn are not in the
# article, and they are already covered by `mariadb-blog`.
name: mariadb-blog-repro
description: MariaDB big-vector benchmark, reproduced on the article's own terms (tuned, ~12-16 h)

datasets:
  - dbpedia-openai-1000k-angular

k: 10
runs: 1

# The article let each system use the machine. Anything else measures our
# constraints rather than their result.
default_resource_pass: tuned

resources:
  cpu:
    # The client drives one connection for the recall sweep, so it needs far
    # less than the server. Leaves the bulk of the box to the engine.
    client_cpus: 8
  memory:
    # tuned resolves memory from host_fraction rather than a fixed number, so
    # nothing is pinned here. See config/resources/tuned.yml.
    client_limit_gb: 24

ann:
  enabled: true
  m_values: [16]
  ef_search: [10, 20, 40, 80, 120, 200, 400, 800]
  batch: false
  # Stated rather than left to the default. Unset it resolves to
  # min(8, cores), so the recall phase was already loading in parallel even in
  # the normalized run -- only the ops build was pinned to one thread. Writing
  # it down keeps the two phases honest about using the same figure.
  insert_threads: 8
  # Under the tuned pass these are taken from resources.extras instead: MariaDB
  # sweeps InnoDB and MyISAM, pgvector sweeps ef_construction [64, 200, 400].
  # Listed here so the profile still works if run with --resource-pass normalized.
  pgvector_ef_construction: 200
  pgvector_build_modes: [post]
  mariadb_storage_engines: [InnoDB]

ops:
  enabled: true
  # Build cost only. The article plots recall-QPS and recall-build and measures
  # nothing else; concurrency, filtered search and churn live in `mariadb-blog`.
  workloads: [build]
  m_values: [16]
  ef_search: 100
  subset_rows: null
  # The whole point of this profile. MHNSW and VIDX build the graph on INSERT,
  # so ingest threads are build threads, and holding them at 1 is what makes
  # the normalized run's build cost incomparable with the published figure.
  # Capped at 8 rather than the full core count so the client is not starved
  # and so the number stays reproducible on a smaller machine.
  load_threads: 8
  max_queries: 500
  # Unused with workloads: [build], kept so the profile degrades sensibly if
  # someone enables the other workloads.
  # Keeps the 2-client point that the measurement profiles dropped on
  # 2026-10-14: here it is a QPS figure compared against a published
  # curve, not a concurrency verdict. The verdict at n=2 is undecidable
  # either way -- see config/profiles/main.yml -- so read this point's
  # throughput and percentiles and ignore its scaling_status.
  client_counts: [1, 2, 4, 8, 16, 32]
  concurrency_duration_s: 60
  selectivities: [0.10]
  churn_fractions: [0.10]
