# Tuned resource pass — each engine configured the way its vendor recommends.
#
# This answers "what can this engine actually do", which the normalized pass
# deliberately does not. It confounds implementation quality with documentation
# quality, so it is reported alongside the normalized pass and never instead of it.
name: tuned
description: Vendor-recommended configuration, full machine

cpu:
  # 0 means "all available cores". On a hybrid CPU the orchestrator still pins
  # to one core class, because the alternative is not "more performance" but
  # "unrepeatable numbers".
  server_cpus: 0
  client_cpus: 4
  prefer_cores: performance
  allow_smt: true

memory:
  # 0 means "a large fraction of host RAM", resolved at run time.
  server_limit_gb: 0
  client_limit_gb: 8
  host_fraction: 0.6
  # These must leave real headroom. At 0.45/0.35/0.15 the three together came to
  # 95% of the container limit, leaving almost nothing for connections, sorting
  # and the query executor. The manifest warned about it and pgvector's tuned
  # pass then died. 0.35/0.25/0.10 totals 70%, a normal shape for a database
  # given a dedicated machine.
  buffer_fraction: 0.35
  graph_cache_fraction: 0.25
  maintenance_fraction: 0.10
  postgres_absorbs_graph_cache: true

build:
  # 0 means "match the server cpuset size". Only pgvector can use this — its
  # bulk build parallelises across maintenance workers. MHNSW and VIDX build
  # incrementally on INSERT and have no equivalent, which is precisely the
  # difference this pass is meant to show.
  threads: 0
  # Without a cap, a 40-core server resolved to 76 parallel maintenance workers.
  # That exhausted the container's /dev/shm with dynamic shared memory segments
  # and killed pgvector's tuned pass outright, while helping nothing: parallel
  # index build stops paying well before this many workers.
  max_threads: 8

isolation:
  # AliSQL still requires RC; the others run at their own defaults here, because
  # that is what a vendor-recommended deployment looks like.
  transaction_isolation: engine_default

durability:
  relaxed: true

docker:
  shm_size: 8g
  network_isolated: true

# Extra curves that only make sense once each engine is allowed its own idioms.
extras:
  # MyISAM is no longer swept. It measured well (84% more throughput, a sixth
  # of the build time, and it turned the churn cliff into a slope), but it is
  # not transactional, so it is not a configuration anyone deploys vector
  # search on. The tuned-complete run of 2026-08-17 has the numbers if they are
  # ever wanted again; set this to [InnoDB, MyISAM] to measure it.
  mariadb_storage_engines: [InnoDB]
  # The one build knob only pgvector exposes. Swept here, pinned in the
  # normalized pass so pgvector is not handed a tuning axis the others lack.
  pgvector_ef_construction: [64, 200, 400]
  pgvector_iterative_scan: [off, relaxed_order]
  # Percona Search compresses indexed vectors; nothing else here can. MongoDB
  # advises quantizing above a 3 GB vector index and 990k x 1536 float32 is
  # 5.7 GB, so scalar is the vendor-recommended configuration at this corpus
  # size rather than a thumb on the scale. Pinned to none in the normalized
  # pass, where no engine gets an axis the others lack.
  #
  # Both are swept because the first complete curve stopped at recall 0.892 and
  # did not move between numCandidates 400 and 800 -- and an index that will
  # not reach 0.90 at any query effort is a different claim from an engine that
  # will not. Without the unquantized curve beside it there is no way to say
  # which of the two was measured. It also costs almost nothing: the vectors
  # are held at full fidelity either way, so scalar took the recall and
  # returned none of the 16.5 GB it was supposed to save.
  #
  # scalar stays first: ops builds one index, and it takes this list's head.
  mongodb_quantization: [scalar, none]
  # valkey-search exposes ef_construction as pgvector does, so the tuned pass
  # sweeps it for both. The normalized pass pins both, because MariaDB and
  # AliSQL still have no equivalent.
  valkey_ef_construction: [64, 200, 400]
  # Graph degree, swept only where it is the engine's sole build knob.
  #
  # At M=16 the lowest query effort MHNSW and VIDX offer already returns recall
  # 0.94-0.98, so all three had no measurement anywhere near the 0.90 floor the
  # headline table reports at, while pgvector and Valkey -- which have
  # ef_construction as well -- reach 0.76. The m-sweep of 2026-08-28 measured
  # what each M actually reaches at 90,000 rows:
  #
  #            M=6     M=8     M=16
  #   mariadb     0.815   0.891   0.949
  #   mariadb123  0.818   0.909   0.976
  #   alisql      0.736   0.875   0.964
  #
  # M=8 would leave MariaDB 12.3 at 0.909, still above the floor and still
  # daggered. M=6 puts all three around 0.82 and its ef sweep runs up to 0.98,
  # so one extra value covers the 0.90 and 0.95 floors with real points.
  #
  # Recall at fixed M barely moves with corpus size -- M=16 differs by at most
  # 0.014 between 90,000 and 990,000 rows -- so the mapping above transfers.
  #
  # It costs a full incremental reload per engine: about 16 hours for the three
  # together, and nothing for the other three, which is the point of doing it
  # per engine rather than globally.
  m_values_by_engine:
    mariadb: [6, 16]
    mariadb123: [6, 16]
    alisql: [6, 16]
