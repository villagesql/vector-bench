<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vector-bench — sign in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form class="login" id="login-form">
    <h1>vector-bench</h1>
    <p class="muted" id="login-note">Sign in to continue.</p>
    <label>
      Password
      <input type="password" id="password" autocomplete="current-password" autofocus required>
    </label>
    <button type="submit" class="action" id="submit">Sign in</button>
    <p class="err" id="error"></p>
  </form>
<script src="/login.js"></script>
</body>
</html>
