# Default (full-profile) MyVector sweep.
#
# scripts/render-configs.py overwrites this file in the working copy according to
# the selected profile, so editing it here only changes the standalone default.
#
# `M` and `efConstruction` are column options (`M=`, `ef=` -- exact case; the
# plugin ignores `m=`). efConstruction is pinned at 200, the value every other
# engine with the knob is built at, for the reason percona/config.yml gives.
# The ef_search grid matches every other engine's so the curves are sampled at
# the same points; hnswlib searches at max(ef_search, k).
float:
  any:
  - base_args: ['@metric']
    constructor: MyVector
    disabled: false
    docker_tag: vector-bench/myvector-bench
    module: ann_benchmarks.algorithms.myvector
    name: myvector
    run_groups:
      innodb:
        arg_groups: [{M: [6, 8, 16, 24, 32], efConstruction: [200]}]
        args: {}
        query_args: [[10, 20, 40, 80, 120, 200, 400, 800]]
